          --border:rgba(148,163,184,0.12);

          --accent-glow:rgba(59,130,246,0.28);
          --grid:rgba(59,130,246,0.06);

        .portfolio-root.light{

          --surface-2:#F1F5F9;
          --surface-3:#E2E8F0;
          --text:#0F172A;
          --text-muted:#475569;
          --text-dim:#64748B;
          --border:rgba(15,23,42,0.08);
          --border-strong:rgba(30,58,138,0.18);
          --accent:#1E3A8A;
          --accent-2:#3B82F6;
          --accent-glow:rgba(30,58,138,0.18);
          --grid:rgba(15,23,42,0.04);
        }
        /* subtle grid */
        .portfolio-root::before{
          content:"";
          position:fixed; inset:0;
          background-image:
            linear-gradient(var(--grid) 1px, transparent 1px),
            linear-gradient(90deg, var(--grid) 1px, transparent 1px);
          background-size:40px 40px;
          mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 85%);
          pointer-events:none;
          z-index:0;
        }
        .shell{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 20px}
        @media(min-width:900px){ .shell{padding:0 28px} }

        /* nav */
        .nav-wrap{
          position:sticky; top:var(--safe-area-inset-top); z-index:50;
          backdrop-filter:blur(16px) saturate(1.2);
          background:color-mix(in srgb, var(--bg) 84%, transparent);
          border-bottom:1px solid var(--border);
        }
        .nav-inner{display:flex; align-items:center; justify-content:space-between; height:66px}
        .brand{display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:-0.02em}
        .brand-mark{
          width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
          background:linear-gradient(135deg, var(--accent-2), var(--accent));
          color:white; font-family:JetBrains Mono, monospace; font-weight:700; font-size:14px;
          box-shadow:0 0 0 1px var(--border-strong), 0 8px 24px var(--accent-glow);
        }
        .nav-links{display:none; gap:8px}
        @media(min-width:900px){ .nav-links{display:flex} }
        .nav-link{
          padding:8px 14px; border-radius:999px; font-size:14px; font-weight:500;
          color:var(--text-muted); transition:all .22s; border:1px solid transparent; text-decoration:none;
        }
        .nav-link:hover{color:var(--text); background:var(--surface-2); border-color:var(--border)}
        .nav-link.active{color:var(--text); background:var(--surface); border-color:var(--border-strong); box-shadow:0 0 0 3px var(--accent-glow)}
        .nav-actions{display:flex; align-items:center; gap:10px}
        .icon-btn{
          width:38px; height:38px; border-radius:999px; display:grid; place-items:center;
          border:1px solid var(--border); background:var(--surface); color:var(--text);
          cursor:pointer; transition:all .2s;
        }
        .icon-btn:hover{transform:translateY(-1px); box-shadow:0 8px 20px var(--accent-glow); border-color:var(--border-strong)}

          display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:999px;
          font-weight:600; font-size:14px; text-decoration:none; cursor:pointer;
          background:linear-gradient(135deg, var(--accent-2), var(--accent));
          color:white; border:1px solid transparent; box-shadow:0 8px 22px var(--accent-glow);
          transition:all .22s;
        }
        .btn-primary:hover{transform:translateY(-1px); box-shadow:0 12px 28px var(--accent-glow); filter:brightness(1.08)}
        .btn-ghost{
          display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border-radius:999px;

        }
        .btn-ghost:hover{background:var(--surface-2); border-color:var(--border-strong); transform:translateY(-1px)}

          margin:18px 0 14px;
        }
        .hero-title .accent{
          background:linear-gradient(135deg, var(--accent-2), var(--accent));

        }
        .hero-sub{font-size:clamp(16px, 2.1vw, 19px); color:var(--text-muted); line-height:1.5; max-width:56ch; margin-bottom:18px}
        .typed-wrap{
          font-family:JetBrains Mono, monospace; font-size:15px; color:var(--accent-2);
          background:var(--surface); border:1px solid var(--border); border-radius:12px;
          padding:12px 14px; display:inline-flex; align-items:center; min-height:46px; max-width:100%;
        }
        .portfolio-root.dark .typed-wrap{color:#93C5FD}
        .typed-cursor{display:inline-block; width:10px; height:18px; background:var(--accent); margin-left:4px; animation:blink 1s step-end infinite; vertical-align:middle}
        @keyframes blink{50%{opacity:0}}
        .hero-ctas{display:flex; flex-wrap:wrap; gap:12px; margin-top:22px}
        .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:28px; max-width:520px}
        .stat{
          background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px 14px;
        }
        .stat-num{font-weight:800; font-size:22px; letter-spacing:-0.02em}
        .stat-label{font-size:12px; color:var(--text-muted); margin-top:2px; line-height:1.3}
        .hero-visual{position:relative; display:grid; place-items:center}
        .photo-frame{
          position:relative; width:min(360px, 86vw); aspect-ratio:1; border-radius:32px;
          background:radial-gradient(120% 120% at 30% 20%, var(--accent-glow), transparent 60%), var(--surface);
          border:1px solid var(--border-strong); padding:12px; box-shadow:0 20px 60px rgba(0,0,0,0.18), 0 0 0 8px var(--accent-glow);
          overflow:hidden;
        }
        .photo-frame img{width:100%; height:100%; object-fit:cover; border-radius:22px; display:block}
        .photo-badge{
          position:absolute; bottom:18px; left:18px; right:18px; display:flex; align-items:center; justify-content:space-between;
          background:color-mix(in srgb, var(--surface) 86%, transparent);
          backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:14px; padding:10px 12px;
        }
        .badge-dot{width:8px; height:8px; background:#22C55E; border-radius:50%; box-shadow:0 0 0 6px rgba(34,197,94,0.15); animation:pulse 2s infinite}
        @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,0.35)} 70%{box-shadow:0 0 0 10px rgba(34,197,94,0)} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

        /* sections */
        .section{padding:72px 0; border-top:1px solid var(--border)}
        .section-head{display:flex; flex-wrap:wrap; align-items:end; justify-content:space-between; gap:16px; margin-bottom:28px}
        .section-kicker{font-family:JetBrains Mono, monospace; font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent-2); font-weight:600}
        .portfolio-root.dark .section-kicker{color:#60A5FA}
        .section-title{font-size:clamp(28px, 3.6vw, 40px); letter-spacing:-0.03em; font-weight:800; line-height:1}
        .section-desc{color:var(--text-muted); max-width:60ch; line-height:1.6; font-size:15px}
        .grid-2{display:grid; gap:18px}
        @media(min-width:860px){ .grid-2{grid-template-columns:1fr 1fr} }
        .card{
          background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
          padding:20px; transition:all .28s; position:relative; overflow:hidden;
        }
        .card:hover{border-color:var(--border-strong); transform:translateY(-2px); box-shadow:0 16px 40px rgba(0,0,0,0.12), 0 0 0 1px var(--accent-glow)}
        .card-title{font-weight:700; font-size:16px; letter-spacing:-0.01em}
        .tag-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
        .tag{
          font-size:12px; font-weight:600; padding:6px 10px; border-radius:999px;
          background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted);
          display:inline-flex; align-items:center; gap:6px;
        }
        .tag.pro{color:var(--text); border-color:var(--border-strong); background:color-mix(in srgb, var(--accent) 10%, var(--surface-2))}
        .tag-dot{width:5px; height:5px; border-radius:50%; background:var(--accent)}

        /* projects */
        .projects-grid{display:grid; gap:22px}
        @media(min-width:980px){ .projects-grid{grid-template-columns:1fr 1fr} }
        .project{
          background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
          overflow:hidden; transition:all .32s; display:flex; flex-direction:column;
        }
        .project:hover{transform:translateY(-3px); border-color:var(--border-strong); box-shadow:0 20px 50px rgba(0,0,0,0.18)}

        .project-media img{
          width:100%; height:auto; border-radius:14px; border:1px solid var(--border);
          display:block; box-shadow:0 10px 30px rgba(0,0,0,0.18);
        }
        .project-body{padding:20px 20px 18px; display:flex; flex-direction:column; gap:12px; flex:1}
        .project-top{display:flex; align-items:center; justify-content:space-between; gap:12px}
        .project-badge{font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:5px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border-strong)}
        .project-title{font-size:20px; font-weight:800; letter-spacing:-0.02em; line-height:1.1}
        .project-desc{font-size:14px; color:var(--text-muted); line-height:1.6}
        .metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:2px}
        @media(max-width:520px){ .metrics{grid-template-columns:1fr; } }
        .metric{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:10px 10px}
        .metric-v{font-family:JetBrains Mono, monospace; font-weight:600; font-size:12px; color:var(--text)}
        .metric-k{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px}
        .code-block{
          font-family:JetBrains Mono, monospace; font-size:12px; background:#0B1020; color:#CBD5E1;
          border-radius:12px; padding:14px; border:1px solid rgba(148,163,184,0.18); overflow:auto;
          line-height:1.6;
        }
        .portfolio-root.light .code-block{background:#0F172A}

        /* lab */
        .lab-wrap{
          background:linear-gradient(180deg, var(--surface), var(--surface-2));
          border:1px solid var(--border-strong); border-radius:var(--radius-lg);
          padding:18px; overflow:hidden; position:relative;
        }
        @media(min-width:860px){ .lab-wrap{padding:26px} }
        .lab-grid{display:grid; gap:18px}
        @media(min-width:860px){ .lab-grid{grid-template-columns:1.1fr 0.9fr} }
        .lab-diagram{
          background:var(--bg); border:1px solid var(--border); border-radius:16px; padding:16px;
          position:relative; overflow:hidden;
        }
        .node{

        .ip-pill{font-family:JetBrains Mono, monospace; font-size:11px; padding:4px 8px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted)}

        /* contact */
        .contact-grid{display:grid; gap:14px}
        @media(min-width:860px){ .contact-grid{grid-template-columns:repeat(3,1fr)} }
        .contact-card{

        .reveal.delay-2{transition-delay:.16s}
        .reveal.delay-3{transition-delay:.24s}

        footer{padding:36px 0 46px; border-top:1px solid var(--border); color:var(--text-muted); font-size:13px}
